<!-- templates/500.html -->
{% extends "base.html" %}

{% block title %}Error del servidor{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="text-center">
        <div class="display-1 mb-2" style="font-family: var(--font-mono); color: var(--loss); letter-spacing: 0.05em;">500</div>
        <p class="lead text-muted mb-1">Error interno del servidor</p>
        <p class="text-muted mb-4">Algo salió mal de nuestro lado. Intenta de nuevo en unos minutos.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            <i class="bi bi-house"></i> Volver al inicio
        </a>
    </div>
</div>
{% endblock %}
