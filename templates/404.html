<!-- templates/404.html -->
{% extends "base.html" %}

{% block title %}Página no encontrada{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="text-center">
        <div class="display-1 mb-2" style="font-family: var(--font-mono); color: var(--accent); letter-spacing: 0.05em;">404</div>
        <p class="lead text-muted mb-1">Fuera de juego</p>
        <p class="text-muted mb-4">La página que buscas no existe o fue movida.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">
            <i class="bi bi-house"></i> Volver al inicio
        </a>
    </div>
</div>
{% endblock %}
